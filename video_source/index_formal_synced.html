<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:L;font-weight:400;src:url(file:///usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf)}
@font-face{font-family:L;font-weight:700;src:url(file:///usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf)}
@font-face{font-family:P;font-weight:500;src:url(file:///usr/share/fonts/truetype/google-fonts/Poppins-Medium.ttf)}

svg{display:block}
</style></head><body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
/* ============ helpers ============ */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3);
const ez=t=>{t=clamp(t);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2};
const pp=x=>1-Math.abs(1-(((x%2)+2)%2));
const f1=n=>Math.round(n*10)/10;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const NAVY='#0A2A66',BLUE='#1F5FE0',BLUE2='#4A86F5',LB='#EAF2FF',MB='#CFE0FF',GREY='#5B6F9C',YEL='#FFC400',YELBG='#FFF6D6';
const ctx=document.createElement('canvas').getContext('2d');
function meas(s,size,w=400,f='L'){ctx.font=`${w} ${size}px ${f}`;return ctx.measureText(s).width}
const wc={};
function wrap(s,size,w,maxW,f='L'){const k=s+size+w+maxW+f;if(wc[k])return wc[k];
  const ws=s.split(' '),L=[];let cur='';
  for(const x of ws){const t=cur?cur+' '+x:x;if(meas(t,size,w,f)>maxW&&cur){L.push(cur);cur=x}else cur=t}
  if(cur)L.push(cur);return wc[k]=L}
function T(s,x,y,size,fill,o={}){
  const w=o.w||400,a=o.a||'start',f=o.f||'L';
  return `<text x="${f1(x)}" y="${f1(y)}" font-family="${f}" font-size="${size}" font-weight="${w}" fill="${fill}" text-anchor="${a}" ${o.x||''}>${esc(s)}</text>`}
function TW(s,x,y,maxW,size,fill,o={}){const L=wrap(s,size,o.w||400,maxW,o.f||'L'),lh=o.lh||size*1.3;return L.map((l,i)=>T(l,x,y+i*lh,size,fill,o)).join('')}
function rect(x,y,w,h,r,fill,ex=''){return `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" rx="${r}" fill="${fill}" ${ex}/>`}
function circ(x,y,r,fill,ex=''){return `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="${fill}" ${ex}/>`}
function card(x,y,w,h,fill='#fff',r=18,ex=`stroke="${MB}" stroke-width="3"`){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" filter="url(#sh)" ${ex}/>`}
function starP(cx,cy,r,rot=0){let p='';for(let i=0;i<10;i++){const a=rot+i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;p+=(i?'L':'M')+f1(cx+Math.cos(a)*rr)+' '+f1(cy+Math.sin(a)*rr)}return p+'Z'}
function arrow(x1,y1,x2,y2,col,w=6,gap=0){
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const ex=x2-ux*gap,ey=y2-uy*gap,sx=x1+ux*gap,sy=y1+uy*gap,hx=ex-ux*18,hy=ey-uy*18;
  return `<line x1="${f1(sx)}" y1="${f1(sy)}" x2="${f1(hx)}" y2="${f1(hy)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/><polygon points="${f1(ex)},${f1(ey)} ${f1(hx-uy*11)},${f1(hy+ux*11)} ${f1(hx+uy*11)},${f1(hy-ux*11)}" fill="${col}"/>`}
function FU(t,t0,inner,d=.55){if(t<t0)return '';const k=eo((t-t0)/d);return `<g opacity="${f1(k*100)/100}" transform="translate(0 ${f1((1-k)*22)})">${inner}</g>`}
function pill(txt,x,y,w,fill,col,size=24){return rect(x,y,w,42,21,fill)+T(txt,x+w/2,y+29,size,col,{w:700,a:'middle'})}

/* ============ transcript & timing ============ */
const TXT=[
"Welcome to the lesson about Force Directed Placement!",
"Picture every wire connecting circuit parts like an elastic rubber band stretched across a board.",
"Instead of guessing where cells belong, we let these virtual springs pull connected cells closer together over several rounds so signals travel faster and use less routing space.",
"To see how this works, imagine a tug-of-war governed by three simple rules.",
"First, in every round, each free cell moves toward the average position of its wired neighbors—just like finding the middle spot between your friends.",
"Second, a gentle pull toward the center keeps separate clusters from drifting apart.",
"Third, fixed pads stay anchored in place like pins tacked onto a corkboard.",
"Let’s walk through a concrete example with numbers.",
"Suppose free cell E starts at one comma one, while its neighbors pull it toward a target at zero point seven, one.",
"Using a gentle step size alpha of 0 point 20, E glides smoothly to zero point nine four, one—moving twenty percent of the way without overshooting.",
"Putting those steps together gives our complete algorithm.",
"In each round, we blend every free cell toward its target position while keeping fixed pads anchored where they started.",
"Now let’s measure our progress using H-P-W-L, or Half-Perimeter Wirelength—the width plus height of the box enclosing each wire net.",
"At the start, outer cells A through D sit far apart in the corners, stretching total wirelength to 52 point 0.",
"After just two rounds, those outer corner cells drift inward while inner cells E and F follow their neighbors.",
"As a result, the enclosing wire box shrinks from 52 point 0 down to 34 point 5.",
"By the fifth round, total wirelength drops by sixty-four percent, landing near 18 point 7.",
"That is a huge improvement over 52 point 0, though still slightly above the ultra-compact golden benchmark of 14 point 0.",
"Why is 18 point 7 slightly larger than 14 point 0?",
"Because force-directed placement is a fast, continuous global move—like rough-sketching furniture placement—rather than a full legalizer that snaps every cell into exact grid slots.",
"Choosing the right step size alpha is just as important as running enough rounds.",
"If alpha is too tiny, like 0 point 01, cells barely budge; however, if alpha is too huge, like 0 point 95, cells overshoot and collapse into a tangled heap.",
"Before wrapping up, watch out for three classic beginner pitfalls.",
"First, never set alpha so tiny that your layout stalls in place.",
"Second, never set alpha so huge that cells pile on top of each other in one bin.",
"Finally, always compare before-and-after H-P-W-L using the exact same net model so your ruler never changes mid-experiment."];
// narrated sentences: [start,end,anchors=[[wordsBeforePause,resumeTime]]] (from the audio's pauses)
const NAR=[[4.82,6.9],[6.95,9.75],[10.73,20.49,[[6,12.85]]],[21.48,25.43],[26.46,34.50,[[16,31.93]]],[35.49,39.77],[40.82,44.78],[45.76,48.11],
 [49.09,55.37,[[9,51.78]]],[56.33,65.35,[[10,59.66],[18,62.42]]],[66.34,69.0],[70.0,75.97],[76.95,84.97,[[7,80.26],[10,82.06]]],[85.96,92.67,[[14,89.83]]],[93.67,99.29],[100.26,106.06]];
const SENT=[];let cursor=107.0;
TXT.forEach((txt,i)=>{
  const n=txt.split(' ').length;let s,e,an=[];
  if(i<NAR.length){s=NAR[i][0];e=NAR[i][1];an=NAR[i][2]||[]}
  else{s=cursor;e=s+n/3.6+.2;cursor=e+.3}
  SENT.push({txt,s,e,an,words:txt.split(' ')});
});
const END=SENT[25].e+3.0, DUR=END;
SENT.forEach(S=>{ // word start/end times
  const W=S.words,n=W.length,wt=W.map(w=>w.length+2);S.ws=new Array(n);S.we=new Array(n);
  const spans=[];let sI=0,tS=S.s;
  S.an.forEach(([cnt,res])=>{spans.push([sI,cnt,tS,res-.28]);sI=cnt;tS=res});spans.push([sI,n,tS,S.e]);
  spans.forEach(([a,b,t0,t1])=>{let tot=0;for(let k=a;k<b;k++)tot+=wt[k];let acc=0;
    for(let k=a;k<b;k++){S.ws[k]=lerp(t0,t1,acc/tot);acc+=wt[k];S.we[k]=lerp(t0,t1,acc/tot)}});
});
const ws=(i,k)=>SENT[i].ws[k];            // start time of word k of sentence i
const st=i=>SENT[i].s;
const SL=[ // slides
 {s:0,title:'Force-Directed Placement',sc:0},
 {s:st(2)-.15,title:'Why use virtual springs?',sc:1},
 {s:st(3)-.15,title:'Three simple rules',sc:2},
 {s:st(7)-.15,title:'Step-by-step example',sc:3},
 {s:st(10)-.15,title:'The complete algorithm',sc:4},
 {s:st(12)-.15,title:'Measuring progress: HPWL',sc:5},
 {s:st(13)-.15,title:'Start: HPWL = 52.0',sc:6},
 {s:st(14)-.15,title:'After two rounds: HPWL = 34.5',sc:7},
 {s:st(16)-.15,title:'After five rounds: HPWL ≈ 18.7',sc:8},
 {s:st(18)-.15,title:'Why 18.7 is above the 14.0 benchmark',sc:9},
 {s:st(20)-.15,title:'Choosing the step size α',sc:10},
 {s:st(22)-.15,title:'Three classic pitfalls',sc:11}];
SL.forEach((x,i)=>x.e=i<SL.length-1?SL[i+1].s:END);
function slideIdx(t){for(let i=SL.length-1;i>=0;i--)if(t>=SL[i].s)return i;return 0}

/* ============ frame furniture ============ */
const DEFS=`<defs><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0A2A66" flood-opacity=".12"/></filter>
<linearGradient id="gbar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4A86F5"/><stop offset="1" stop-color="#1F5FE0"/></linearGradient></defs>`;
function chrome(t,sl,i){
  let s=rect(0,0,1920,1080,0,'#fff');
  s+=rect(0,0,1920,104,0,NAVY)+rect(0,0,18,104,0,YEL);
  s+=T(sl.title,64,68,44,'#fff',{w:700,f:'P'});
  s+=T(String(i+1).padStart(2,'0')+' / '+String(SL.length).padStart(2,'0'),1860,66,26,YEL,{w:700,f:'P',a:'end'});
  s+=rect(0,104,1920,6,0,'#16408F')+rect(0,104,1920*clamp(t/DUR),6,0,YEL);
  SL.forEach((x,k)=>{if(k)s+=rect(1920*x.s/DUR-1.5,104,3,6,0,'#fff')});
  return s;
}
function caption(t){
  let idx=-1;for(let i=SENT.length-1;i>=0;i--)if(t>=SENT[i].s-.05){idx=i;break}
  if(idx<0||t>SENT[25].e+1.2)return '';
  const S=SENT[idx];
  let s=card(60,920,1800,140,LB,18,`stroke="${MB}" stroke-width="3"`)+rect(60,920,12,140,6,YEL);
  s+=T('TRANSCRIPT',100,952,17,BLUE,{w:700});
  const size=29,maxW=1700,lines=[];let cur=[],curW=0;
  S.words.forEach((w,k)=>{const ww=meas(w+' ',size);if(curW+ww>maxW&&cur.length){lines.push(cur);cur=[];curW=0}cur.push(k);curW+=ww});
  if(cur.length)lines.push(cur);
  const y0=lines.length>1?990:1012;
  lines.forEach((ln,li)=>{let x=100;ln.forEach(k=>{
    const w=S.words[k],ww=meas(w+' ',size),active=t>=S.ws[k]&&t<S.we[k]+.02,done=t>=S.we[k];
    if(active)s+=rect(x-4,y0+li*40-27,meas(w,size)+8,38,8,YEL);
    s+=T(w,x,y0+li*40,size,active||done?NAVY:'#8FA3CC',{w:400});
    x+=ww})});
  return s;
}

/* ============ boards ============ */
const COL={A:'#1F5FE0',B:'#3B7BF2',C:'#0A2A66',D:'#6A9BF7',E:YEL,F:'#2A4FA8'};
const EDGES=[['A','B'],['A','F'],['F','C'],['F','E'],['A','E'],['E','D'],['C','D'],['B','D']];
const P0={A:[0,0],B:[2,0],C:[0,2],D:[2,2],E:[1,1],F:[0,1]};
const P1={A:[.3,.3],B:[1.7,.3],C:[.3,1.7],D:[1.7,1.7],E:[.9,1],F:[.5,1]};
const P2={A:[.7,.6],B:[1.3,.6],C:[.7,1.4],D:[1.3,1.4],E:[.85,1],F:[.5,1]};
const P3={A:[.8,.75],B:[1.2,.75],C:[.8,1.25],D:[1.2,1.25],E:[1,1],F:[.6,1]};
const PC={A:[.93,.93],B:[1.07,.93],C:[.93,1.07],D:[1.07,1.07],E:[1,1],F:[.97,1]};
const mix=(P,Q,k)=>{const o={};for(const n in P)o[n]=[lerp(P[n][0],Q[n][0],k),lerp(P[n][1],Q[n][1],k)];return o};
function springPath(x1,y1,x2,y2,coils,amp,ph){
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,nx=-uy,ny=ux,pad=Math.min(34,L*.25);
  let d=`M ${f1(x1)} ${f1(y1)} `;const N=60;
  for(let i=0;i<=N;i++){const u=i/N,s=u*L;let off=0;if(s>pad&&s<L-pad){const v=(s-pad)/(L-2*pad);off=amp*Math.sin(v*coils*2*Math.PI+ph)*Math.sin(v*Math.PI)**.5}
    d+=`L ${f1(x1+ux*s+nx*off)} ${f1(y1+uy*s+ny*off)} `}
  return d;
}
function drawBoard(t,x,y,w,h,pos,o={}){
  const sc=o.sc||Math.min(w,h)/2.9,cx=x+w/2,cy=y+h/2,nr=o.r||Math.max(20,sc*.17);
  const px=u=>cx+(u-1)*sc,py=v=>cy-(v-1)*sc;let s='';
  if(o.bg!==false){s+=card(x,y,w,h,'#fff',20);
    for(let g=-1;g<=3.01;g+=.5){const gx=px(g),gy=py(g);
      if(gx>x+16&&gx<x+w-16)s+=`<line x1="${f1(gx)}" y1="${y+16}" x2="${f1(gx)}" y2="${y+h-16}" stroke="#E4EDFD" stroke-width="2"/>`;
      if(gy>y+16&&gy<y+h-16)s+=`<line x1="${x+16}" y1="${f1(gy)}" x2="${x+w-16}" y2="${f1(gy)}" stroke="#E4EDFD" stroke-width="2"/>`}}
  if(o.bbox!==false){let x0=9,x1=-9,y0=9,y1=-9;for(const n in pos){x0=Math.min(x0,pos[n][0]);x1=Math.max(x1,pos[n][0]);y0=Math.min(y0,pos[n][1]);y1=Math.max(y1,pos[n][1])}
    const pad=.3;s+=`<rect x="${f1(px(x0-pad))}" y="${f1(py(y1+pad))}" width="${f1((x1-x0+2*pad)*sc)}" height="${f1((y1-y0+2*pad)*sc)}" rx="14" fill="#FFC400" fill-opacity=".13" stroke="#E0A800" stroke-width="4" stroke-dasharray="16 10" stroke-dashoffset="${f1(-t*36)}"/>`;
    if(o.label!==false)s+=T('wire box',px(x0-pad)+6,py(y1+pad)-10,22,'#9A7000',{w:700})}
  if(o.slots)for(const n in pos)s+=rect(px(pos[n][0])-sc*.2,py(pos[n][1])-sc*.2,sc*.4,sc*.4,6,'none','stroke="#E0A800" stroke-width="3" stroke-dasharray="6 5"');
  if(o.ghost){for(const n in o.ghost)s+=circ(px(o.ghost[n][0]),py(o.ghost[n][1]),nr,'none',`stroke="${COL[n]}" stroke-width="4" stroke-dasharray="8 7" opacity=".5"`);
    if(o.arrows)for(const n in o.ghost){const a=[px(o.ghost[n][0]),py(o.ghost[n][1])],b=[px(pos[n][0]),py(pos[n][1])];if(Math.hypot(a[0]-b[0],a[1]-b[1])>nr*1.6)s+=arrow(a[0],a[1],b[0],b[1],'#7FA4EE',5,nr)}}
  EDGES.forEach(([a,b],i)=>{const A=pos[a],B=pos[b],x1=px(A[0]),y1=py(A[1]),x2=px(B[0]),y2=py(B[1]);
    if(o.springs)s+=`<path d="${springPath(x1,y1,x2,y2,o.coils||7,o.amp||11,t*4+i)}" fill="none" stroke="#6C8FD6" stroke-width="4" stroke-linejoin="round"/>`;
    else{s+=`<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" stroke="#8EA8DA" stroke-width="${o.r?5:8}" stroke-linecap="round"/>`;
      const u=(t*.55+i*.137)%1;s+=circ(lerp(x1,x2,u),lerp(y1,y2,u),o.r?4:6,'#fff','stroke="#4A86F5" stroke-width="3"')}});
  Object.keys(pos).forEach((n,i)=>{const bob=Math.sin(t*2.2+i*1.3)*2.5,X=px(pos[n][0]),Y=py(pos[n][1])+bob;
    s+=circ(X,Y+5,nr,'#000','opacity=".12"')+circ(X,Y,nr,COL[n],'stroke="#fff" stroke-width="4"')+T(n,X,Y+nr*.36,nr*1.05,n==='E'?NAVY:'#fff',{w:700,a:'middle',f:'P'});
    if(o.hl&&o.hl.includes(n))s+=circ(X,Y,nr+9+Math.sin(t*6)*3,'none','stroke="#E0A800" stroke-width="4"')});
  return s;
}
function meter(t,t0,x,y,w,val,label='Total wirelength (HPWL)'){
  let g=card(x,y,w,120)+T(label,x+30,y+38,22,GREY,{w:700})+T(val.toFixed(1),x+30,y+98,60,NAVY,{w:700,f:'P'});
  const bx=x+320,bw=w-360;
  g+=rect(bx,y+52,bw,30,15,'#DCE8FF')+rect(bx,y+52,Math.max(30,bw*val/52),30,15,'url(#gbar)');
  const gx=bx+bw*14/52;g+=`<line x1="${f1(gx)}" y1="${y+42}" x2="${f1(gx)}" y2="${y+92}" stroke="${YEL}" stroke-width="6"/>`+T('golden 14.0',gx,y+34,20,'#9A7000',{w:700,a:'middle'});
  g+=T('shorter is better',bx+bw,y+112,20,GREY,{a:'end'});
  return FU(t,t0,g);
}
function infoCards(t,items,times,x,y,w,h,gap,active){
  let s='';items.forEach((it,i)=>{if(t<times[i])return;const yy=y+i*(h+gap),act=i===active;
    let g=card(x,yy,w,h,act?YELBG:'#fff',16,`stroke="${act?YEL:MB}" stroke-width="${act?4:3}"`)+rect(x,yy,10,h,5,act?YEL:BLUE)+circ(x+58,yy+h/2,28,NAVY)+T(String(i+1),x+58,yy+h/2+11,30,YEL,{w:700,a:'middle',f:'P'});
    g+=T(it.h,x+106,yy+48,32,NAVY,{w:700})+TW(it.b,x+106,yy+90,w-136,27,GREY,{lh:35});
    s+=FU(t,times[i],g)});return s;
}
function chips(t,items,times,x,y,w){let s='';items.forEach((it,i)=>{const yy=y+i*84;
  s+=FU(t,times[i],rect(x,yy,w,68,34,LB,`stroke="${MB}" stroke-width="3"`)+circ(x+40,yy+34,20,YEL)+`<polyline points="${x+31},${yy+34} ${x+38},${yy+42} ${x+50},${yy+26}" fill="none" stroke="${NAVY}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`+T(it,x+80,yy+44,27,NAVY,{w:700}))});return s}
function textCard(t,t0,x,y,w,h,head,body){return FU(t,t0,card(x,y,w,h)+rect(x,y,10,h,5,BLUE)+T(head,x+40,y+50,30,NAVY,{w:700})+TW(body,x+40,y+92,w-80,27,GREY,{lh:36}))}

/* ============ scenes ============ */
const SC=[];
// 0 title
SC[0]=(t)=>{
  let s=FU(t,.3,T('Force-Directed',100,330,100,NAVY,{w:700,f:'P'}))+FU(t,.6,T('Placement',100,445,100,BLUE,{w:700,f:'P'}))+FU(t,.9,rect(100,478,170,12,6,YEL));
  s+=FU(t,1.3,TW('How virtual springs decide where circuit cells belong',100,560,780,38,GREY,{lh:50}));
  s+=FU(t,ws(0,0),pill('Wires act like rubber bands',100,720,400,NAVY,'#fff',24))+FU(t,ws(1,6),pill('Cells are pulled closer',520,720,340,YEL,NAVY,24));
  const k=t<4.8?0:ez(pp((t-4.8)/5)),pos=mix(P0,P1,k*.95);
  let b=drawBoard(t,1000,150,780,700,pos,{springs:true,amp:12-6*k,bbox:true,sc:215})+T('every wire pulls like an elastic rubber band',1390,826,24,GREY,{a:'middle'});
  return s+FU(t,.4,b);
};
// 1 why springs
SC[1]=(t)=>{
  const a=st(2),k=ez(pp((t-a)/4.5)),pos=mix(P0,P2,k);
  let s=FU(t,a,drawBoard(t,80,150,820,640,pos,{sc:240})+pill('springs shorten the wires round by round',150,808,680,NAVY,'#fff',24));
  const times=[ws(2,0),ws(2,6),ws(2,19)];const act=t<times[1]?0:t<times[2]?1:2;
  s+=infoCards(t,[{h:'No guessing',b:'Instead of guessing where cells belong, we let virtual springs decide.'},{h:'Springs pull cells closer',b:'Connected cells move closer together over several rounds.'},{h:'Faster signals, less routing space',b:'Shorter wires let signals travel faster and use less routing space.'}],times,960,150,880,170,22,act);
  s+=FU(t,times[2]+1.2,card(960,730,880,110,YELBG,16,`stroke="${YEL}" stroke-width="3"`)+T('Goal: the shortest possible wires',1000,798,34,NAVY,{w:700}));
  return s;
};
// 2 three rules
SC[2]=(t)=>{
  const ox=80,oy=150,pw=860,ph=700;
  const B=[ox+160,oy+470],D=[ox+360,oy+580],F=[ox+210,oy+210],P=[ox+730,oy+560],E0=[ox+640,oy+250],Cn=[ox+430,oy+390];
