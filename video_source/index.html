<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
/* ---------- helpers ---------- */
const W=1920,H=1080,DUR=176.2333;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3);
const eob=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const ez=t=>{t=clamp(t);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2};
const pp=x=>1-Math.abs(1-(((x%2)+2)%2));
const R=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const f1=n=>Math.round(n*10)/10;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const INK='#1F2A5A',SOFT='#6B7AA8';
const ctx=document.createElement('canvas').getContext('2d');
function meas(s,size,w=500,f='P'){ctx.font=`${w} ${size}px ${f}`;return ctx.measureText(s.replace(/\*\*/g,'')).width}
const wrapCache={};
function wrap(s,size,w,maxW){
  const key=s+size+w+maxW; if(wrapCache[key])return wrapCache[key];
  const words=s.split(' '),lines=[];let cur='';
  for(const wd of words){const tst=cur?cur+' '+wd:wd; if(meas(tst,size,w)>maxW&&cur){lines.push(cur);cur=wd}else cur=tst}
  if(cur)lines.push(cur); return wrapCache[key]=lines;
}
function T(s,x,y,size,fill,o={}){
  const weight=o.w||500,anchor=o.a||'start',font=o.f||'P';
  const parts=s.split('**');let inner='';
  parts.forEach((p,i)=>{if(!p)return;const b=i%2===1;inner+=`<tspan${b?` font-weight="700" fill="${o.acc||'#FF5C93'}"`:''}>${esc(p)}</tspan>`});
  return `<text x="${f1(x)}" y="${f1(y)}" font-family="${font}" font-size="${size}" font-weight="${weight}" fill="${fill}" text-anchor="${anchor}" ${o.x||''}>${inner}</text>`;
}
function TW(s,x,y,maxW,size,fill,o={}){const L=wrap(s,size,o.w||500,maxW),lh=o.lh||size*1.35;return L.map((l,i)=>T(l,x,y+i*lh,size,fill,o)).join('')}
function TC(s,x,cy,maxW,size,fill,o={}){ // vertically centred wrapped text
  const L=wrap(s,size,o.w||500,maxW),lh=o.lh||size*1.3;
  const y0=cy-(L.length-1)*lh/2+size*0.35;
  return L.map((l,i)=>T(l,x,y0+i*lh,size,fill,o)).join('');
}
function G(t,t0,inner,cx,cy,o={}){
  if(t<t0)return '';
  const u=(t-t0)/(o.d||.45),k=eob(u),a=clamp((t-t0)/.18);
  return `<g opacity="${f1(a*100)/100}" transform="translate(${f1(cx)} ${f1(cy)}) scale(${k.toFixed(3)}) translate(${f1(-cx)} ${f1(-cy)})">${inner}</g>`;
}
function rect(x,y,w,h,r,fill,ex=''){return `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" rx="${r}" fill="${fill}" ${ex}/>`}
function circ(x,y,r,fill,ex=''){return `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="${fill}" ${ex}/>`}
function starP(cx,cy,r,rot=0){let p='';for(let i=0;i<10;i++){const a=rot+i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;p+=(i?'L':'M')+f1(cx+Math.cos(a)*rr)+' '+f1(cy+Math.sin(a)*rr)}return p+'Z'}
function card(x,y,w,h,fill='#fff',r=36,ex=''){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" filter="url(#sh)" ${ex}/>`}
function arrow(x1,y1,x2,y2,col,w=6,gap=0){
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const ex=x2-ux*gap,ey=y2-uy*gap,sx=x1+ux*gap,sy=y1+uy*gap;
  const hx=ex-ux*18,hy=ey-uy*18;
  return `<line x1="${f1(sx)}" y1="${f1(sy)}" x2="${f1(hx)}" y2="${f1(hy)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`+
   `<polygon points="${f1(ex)},${f1(ey)} ${f1(hx-uy*11)},${f1(hy+ux*11)} ${f1(hx+uy*11)},${f1(hy-ux*11)}" fill="${col}"/>`;
}
const PAST=['#FFE9A8','#C9F2DC','#D3E1FF','#FFD3E3'],DARK=['#FFB300','#2BBF7E','#4C7DFF','#FF5C93'];
function bulletCards(t,items,times,x,y,w,h,gap,size){
  let s='';
  items.forEach((it,i)=>{
    const yy=y+i*(h+gap),cy=yy+h/2;
    const inner=rect(x,yy,w,h,34,PAST[i%4],`stroke="#fff" stroke-width="5"`)+circ(x+66,cy,38,DARK[i%4])+T(String(i+1),x+66,cy+16,46,'#fff',{w:700,a:'middle'})+TC(it,x+130,cy,w-160,size,INK,{acc:DARK[i%4]==='#FFB300'?'#E07B00':DARK[i%4]});
    s+=G(t,times[i],inner,x+w/2,cy);
  });
  return s;
}

/* ---------- schedule (seconds) ---------- */
const CUT=[106.33,143.7],GAP=CUT[1]-CUT[0],DUR2=DUR-GAP; // browser-lab + implement-track sections are cut out
const toOut=t=>t<CUT[0]?t:(t<CUT[1]?CUT[0]:t-GAP);
const SEC=[
 {sc:0,s:0,e:16.47,title:'',acc:'#FF5C93',phrase:"Hi! I'm Pip!",mood:'wave'},
 {sc:1,s:16.47,e:34.03,title:'The big idea',acc:'#4C7DFF',phrase:"Let's learn!",mood:'smile'},
 {sc:2,s:34.03,e:51.63,title:'Pseudocode',acc:'#9B5DFF',phrase:"Easy as a recipe!",mood:'smile'},
 {sc:3,s:51.63,e:60.27,title:'Algorithm sketch',acc:'#00B8A9',phrase:"Here's the recipe!",mood:'smile'},
 {sc:5,s:60.27,e:70.7,title:'Start from HPWL fifty-two',acc:'#4C7DFF',phrase:"Long wires...",mood:'worry'},
 {sc:6,s:70.7,e:79.93,title:'Neighbors pull cells inward',acc:'#FF5C93',phrase:"Pull, pull, pull!",mood:'o'},
 {sc:7,s:79.93,e:88.17,title:'After force: about 18.7',acc:'#2BBF7E',phrase:"Much better!",mood:'smile'},
 {sc:8,s:88.17,e:96.97,title:'Force vs golden compact',acc:'#FFB300',phrase:"Almost golden!",mood:'smile'},
 {sc:9,s:96.97,e:106.33,title:'Alpha trades speed vs collapse',acc:'#9B5DFF',phrase:"Not too big!",mood:'o'},
 {sc:12,s:143.7,e:161.37,title:'Pitfalls',acc:'#FF5C93',phrase:"Watch out!",mood:'worry'},
 {sc:13,s:161.37,e:176.24,title:'Your turn!',acc:'#4C7DFF',phrase:"You can do it!",mood:'cheer'}
];
const SCH={
 s1:[16.9,23.2,25.45,29.7], s2:[34.4,39.55,41.9,46.3],
 s4:[55.5,56.1,56.7,57.3,57.9,58.5,59.1],
 s5:[60.6,66.8,67.9,69.0], s6:[70.9,77.5,78.2,78.9], s7:[80.2,83.8,85.1,86.4],
 s8:[88.4,91.3,92.9,94.4], s9:[97.2,101.3,102.6,103.9],
 s10:[106.6,111.7,119.1], s11:[124.8,131.8,140.0], s12:[144.2,150.0,155.6],
 s13:[161.7,165.95,169.7,174.4]
};
window.POPS=[...SEC.map(x=>x.s),...[].concat(...Object.values(SCH))];
function secIndex(t){for(let i=SEC.length-1;i>=0;i--)if(t>=SEC[i].s)return i;return 0}

/* ---------- background, progress, mascot ---------- */
const DEFS=`<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFE8FF"/><stop offset=".65" stop-color="#E6F6FF"/><stop offset="1" stop-color="#FFF3C9"/></linearGradient>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF5C93"/><stop offset=".5" stop-color="#FF9A3D"/><stop offset="1" stop-color="#9B5DFF"/></linearGradient>
<linearGradient id="gb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF5C93"/><stop offset=".5" stop-color="#FFB300"/><stop offset="1" stop-color="#2BBF7E"/></linearGradient>
<linearGradient id="gm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2BBF7E"/><stop offset=".5" stop-color="#FFB300"/><stop offset="1" stop-color="#FF5C93"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1F2A5A" flood-opacity=".16"/></filter>
</defs>`;
const BUB=['#FF9EB5','#FFD23F','#7FD1FF','#B79CFF','#8CE6B0','#FFB07A'];
function cloud(x,y,sc,a){return `<g transform="translate(${f1(x)} ${y}) scale(${sc})" opacity="${a}"><ellipse cx="0" cy="0" rx="90" ry="34" fill="#fff"/><circle cx="-30" cy="-26" r="38" fill="#fff"/><circle cx="25" cy="-34" r="46" fill="#fff"/></g>`}
function bg(t){
  let s=rect(0,0,W,H,0,'url(#sky)');
  [[200,170,1.0,.9,22],[900,120,1.3,.8,14],[1500,230,.9,.85,28],[1100,360,.7,.6,18]].forEach(([x,y,sc,a,sp],i)=>{
    const xx=((x+t*sp)%2400)-240; s+=cloud(xx,y,sc,a)});
  for(let i=0;i<14;i++){
    const sp=18+R(i+30)*26,y=1120-((t*sp+R(i+60)*1300)%1300),x=R(i)*1920+Math.sin(t*.8+i)*22,r=14+R(i+90)*30;
    s+=circ(x,y,r,BUB[i%6],'opacity=".38"');
  }
  s+=`<path d="M0 1005 Q 400 935 820 990 T 1620 972 T 1920 1000 V1080 H0Z" fill="#B3EBAA"/>`;
  s+=`<path d="M0 1052 Q 520 1000 1020 1042 T 1920 1030 V1080 H0Z" fill="#82DB8F"/>`;
  return s;
}
function progress(t){
  const x0=120,x1=1800,w=x1-x0,p=clamp(toOut(t)/DUR2);
  let s=rect(x0,30,w,18,9,'#fff','opacity=".75"')+rect(x0,30,Math.max(18,w*p),18,9,'url(#gb)');
  SEC.forEach((c,i)=>{if(i===0)return;const x=x0+w*toOut(c.s)/DUR2;s+=circ(x,39,5,t>=c.s?'#fff':'#B9C6E8')});
  const kx=x0+w*p;s+=`<path d="${starP(kx,39,22,t*1.5)}" fill="#FFD23F" stroke="#F2A900" stroke-width="4" stroke-linejoin="round"/>`;
  return s;
}
function mascot(t,sec){
  const cheer=sec.mood==='cheer';
  const jump=cheer?Math.abs(Math.sin(t*5))*55:Math.abs(Math.sin(t*3))*12;
  const cx=1795,ground=1010,cy=ground-72-jump;
  const blink=(t%3.3)<.13;
  let m=sec.mood;
  let s=`<ellipse cx="${cx}" cy="${ground}" rx="${f1(62-jump*.3)}" ry="12" fill="#000" opacity=".12"/>`;
  s+=`<g transform="translate(${cx} ${f1(cy)})">`;
  s+=`<line x1="0" y1="-60" x2="0" y2="-92" stroke="#F2A900" stroke-width="6" stroke-linecap="round"/>`+circ(0,-98+Math.sin(t*6)*3,11,'#FF5C93');
  if(m==='wave'||m==='cheer'){const a=Math.sin(t*9)*18;s+=`<line x1="56" y1="8" x2="94" y2="${f1(-34+a)}" stroke="#F2A900" stroke-width="12" stroke-linecap="round"/>`+circ(96,-38+a,13,'#FFD23F','stroke="#F2A900" stroke-width="5"')}
  s+=`<ellipse cx="-26" cy="66" rx="22" ry="11" fill="#F2A900"/><ellipse cx="26" cy="66" rx="22" ry="11" fill="#F2A900"/>`;
  s+=circ(0,0,64,'#FFD23F','stroke="#F2A900" stroke-width="6"');
  s+=circ(-38,16,11,'#FF9EB5','opacity=".85"')+circ(38,16,11,'#FF9EB5','opacity=".85"');
  [-22,22].forEach(ex=>{s+=`<ellipse cx="${ex}" cy="-8" rx="9" ry="${blink?1.5:13}" fill="${INK}"/>`;if(!blink)s+=circ(ex-3,-13,3.5,'#fff')});
  if(m==='worry'){s+=`<line x1="-36" y1="-30" x2="-12" y2="-38" stroke="${INK}" stroke-width="5" stroke-linecap="round"/><line x1="12" y1="-38" x2="36" y2="-30" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`;
    s+=`<path d="M-16 32 Q0 18 16 32" stroke="${INK}" stroke-width="6" fill="none" stroke-linecap="round"/>`}
  else if(m==='o'){s+=`<ellipse cx="0" cy="26" rx="13" ry="${f1(14+Math.sin(t*8)*2)}" fill="${INK}"/>`}
  else{s+=`<path d="M-20 16 Q0 40 20 16" stroke="${INK}" stroke-width="6" fill="none" stroke-linecap="round"/>`}
  s+=`</g>`;
  // speech bubble
  const lt=t-sec.s,show=lt>.8&&lt<5.4;
  if(show){
    const w=meas(sec.phrase,34,700)+64,x=1715-w,y=905,k=eob((lt-.8)/.4)*(1-eo((lt-5)/.4));
    const inner=rect(x,y,w,72,36,'#fff','stroke="#FFD23F" stroke-width="5" filter="url(#sh)"')+`<polygon points="${f1(x+w-4)},${y+22} ${f1(x+w+34)},${y+50} ${f1(x+w-4)},${y+52}" fill="#fff" stroke="#FFD23F" stroke-width="5" stroke-linejoin="round"/>`+rect(x+w-12,y+16,16,44,0,'#fff')+T(sec.phrase,x+w/2-6,y+49,34,INK,{w:700,a:'middle'});
    s+=`<g transform="translate(${f1(x+w)} ${y+36}) scale(${f1(Math.max(k,0)*100)/100}) translate(${f1(-(x+w))} ${-(y+36)})">${inner}</g>`;
  }
  return s;
}
function burst(t){
  let s='';
  SEC.forEach((c,i)=>{
    if(i===0)return;const d=t-c.s;if(d<0||d>.8)return;
    for(let k=0;k<12;k++){const a=k/12*Math.PI*2+R(i)*3,r=60+d*520*eo(d/.8)*(.7+R(k+i)*.6);
      const x=1795+Math.cos(a)*r*1.3-300*eo(d/.8)*0,y=900+Math.sin(a)*r*.9-d*80;
      s+=`<path d="${starP(x,y,18-d*14+R(k)*8,d*6+k)}" fill="${BUB[k%6]}" opacity="${f1(1-d/.8)}"/>`}
  });
  return s;
}

/* ---------- graph board ---------- */
const COL={A:'#00B8A9',B:'#FF7A3D',C:'#3D7BFF',D:'#9B5DFF',E:'#FFC21A',F:'#3CCB6A'};
const EDGES=[['A','B'],['A','F'],['F','C'],['F','E'],['A','E'],['E','D'],['C','D'],['B','D']];
const P0={A:[0,0],B:[2,0],C:[0,2],D:[2,2],E:[1,1],F:[0,1]};
const P1={A:[.3,.3],B:[1.7,.3],C:[.3,1.7],D:[1.7,1.7],E:[.9,1],F:[.5,1]};
const P2={A:[.7,.6],B:[1.3,.6],C:[.7,1.4],D:[1.3,1.4],E:[.85,1],F:[.5,1]};
const P3={A:[.8,.75],B:[1.2,.75],C:[.8,1.25],D:[1.2,1.25],E:[1,1],F:[.6,1]};
const PC={A:[.93,.93],B:[1.07,.93],C:[.93,1.07],D:[1.07,1.07],E:[1,1],F:[.97,1]};
const mix=(P,Q,k)=>{const o={};for(const n in P)o[n]=[lerp(P[n][0],Q[n][0],k),lerp(P[n][1],Q[n][1],k)];return o};
function drawBoard(t,x,y,w,h,pos,o={}){
  const sc=Math.min(w,h)/2.9,cx=x+w/2,cy=y+h/2,nr=o.r||Math.max(20,sc*.18);
  const px=u=>cx+(u-1)*sc,py=v=>cy-(v-1)*sc;
  let s='';
  if(o.bg!==false){s+=rect(x,y,w,h,36,'#fff','stroke="#BFD7FF" stroke-width="6" filter="url(#sh)"');
    for(let g=-1;g<=3.01;g+=.5){const gx=px(g),gy=py(g);
      if(gx>x+20&&gx<x+w-20)s+=`<line x1="${f1(gx)}" y1="${y+22}" x2="${f1(gx)}" y2="${y+h-22}" stroke="#E3EEFF" stroke-width="3"/>`;
      if(gy>y+20&&gy<y+h-20)s+=`<line x1="${x+22}" y1="${f1(gy)}" x2="${x+w-22}" y2="${f1(gy)}" stroke="#E3EEFF" stroke-width="3"/>`}}
  // bounding "wire box"
  if(o.bbox!==false){let x0=9,x1=-9,y0=9,y1=-9;for(const n in pos){x0=Math.min(x0,pos[n][0]);x1=Math.max(x1,pos[n][0]);y0=Math.min(y0,pos[n][1]);y1=Math.max(y1,pos[n][1])}
    const pad=.3;s+=`<rect x="${f1(px(x0-pad))}" y="${f1(py(y1+pad))}" width="${f1((x1-x0+2*pad)*sc)}" height="${f1((y1-y0+2*pad)*sc)}" rx="22" fill="#FFB300" fill-opacity=".12" stroke="#FFA000" stroke-width="5" stroke-dasharray="18 12" stroke-dashoffset="${f1(-t*40)}"/>`;
    if(o.label!==false)s+=T('wire box',px(x0-pad)+6,py(y1+pad)-10,26,'#C77E00',{w:700})}
  // ghost
  if(o.ghost){for(const n in o.ghost){const gx=px(o.ghost[n][0]),gy=py(o.ghost[n][1]);s+=circ(gx,gy,nr,'none',`stroke="${COL[n]}" stroke-width="5" stroke-dasharray="9 8" opacity=".6"`)}
    if(o.arrows)for(const n in o.ghost){const a=[px(o.ghost[n][0]),py(o.ghost[n][1])],b=[px(pos[n][0]),py(pos[n][1])];if(Math.hypot(a[0]-b[0],a[1]-b[1])>nr*1.6)s+=arrow(a[0],a[1],b[0],b[1],COL[n],6,nr)}}
  // wires
  EDGES.forEach(([a,b],i)=>{const A=pos[a],B=pos[b],x1=px(A[0]),y1=py(A[1]),x2=px(B[0]),y2=py(B[1]);
    s+=`<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" stroke="#9DB3DD" stroke-width="${o.r?6:9}" stroke-linecap="round"/>`;
    const u=(t*.55+i*.137)%1;s+=circ(lerp(x1,x2,u),lerp(y1,y2,u),o.r?5:7,'#fff','stroke="#6E8ED0" stroke-width="3"')});
  // nodes
  Object.keys(pos).forEach((n,i)=>{const bob=Math.sin(t*2.2+i*1.3)*3,X=px(pos[n][0]),Y=py(pos[n][1])+bob;
    s+=circ(X,Y+6,nr,'#000','opacity=".14"')+circ(X,Y,nr,COL[n],'stroke="#fff" stroke-width="5"')+T(n,X,Y+nr*.36,nr*1.05,n==='E'?'#7A5200':'#fff',{w:700,a:'middle'})});
  return s;
}
function hpwlColor(v){return v>35?'#FF5C93':v>20?'#FF9A00':'#2BBF7E'}
function meter(t,x,y,val,t0,extra){
  const w=840,h=120;let inner=card(x,y,w,h);
  inner+=T('Wire length (HPWL)',x+34,y+42,26,SOFT,{w:500})+T(val>=51.95?'52':val.toFixed(1),x+34,y+98,64,hpwlColor(val),{w:700});
  const bx=x+330,bw=470;
  inner+=rect(bx,y+56,bw,32,16,'#E8EEFF')+rect(bx,y+56,Math.max(32,bw*val/52),32,16,'url(#gm)');
  const gx=bx+bw*14/52;inner+=`<line x1="${f1(gx)}" y1="${y+46}" x2="${f1(gx)}" y2="${y+98}" stroke="#FFB300" stroke-width="5"/>`+T('golden 14',gx,y+36,22,'#C98A00',{w:700,a:'middle'});
  inner+=T('shorter is better!',bx+bw,y+116-4,22,SOFT,{w:500,a:'end'});
  return G(t,t0,inner,x+w/2,y+h/2);
}
function headerT(t,sec,extra=''){
  const lt=t-sec.s,k=eob(lt/.5);const wd=meas(sec.title,72,700,'P');
  return `<g transform="translate(110 150) scale(${f1(k*100)/100}) translate(-110 -150)">${T(sec.title,110,150,72,INK,{w:700})}${rect(110,168,wd*eo(lt/.8),12,6,sec.acc)}${extra}</g>`;
}
function stepBadge(t,n,t0,acc){
  let inner=rect(980,190,420,64,32,'#fff','stroke="'+acc+'" stroke-width="5"')+T(`Step ${n} of 5`,1010,235,32,INK,{w:700});
  for(let i=0;i<5;i++)inner+=circ(1255+i*30,222,10,i<n?acc:'#DCE5FA');
  return G(t,t0,inner,1190,222);
